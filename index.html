<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drift — an instrument</title>
    <meta
      name="description"
      content="A constellation you can play: tap or drag to release a star, let it drift, and listen for what it becomes."
    />

    <!--
      The link-preview card (public/card.png, 1200x630) is a frame of the
      instrument itself, captured from the running page rather than drawn: the
      Southern Cross it opens on, unmoored and resonating, with a few placed
      stars around it. What a shared link promises is then a thing the page
      actually does. Regenerate it the same way if the sky changes.

      The URL resolves against the page that names it, like any link, so this
      relative form is wrong one directory down --- copy an absolute path, not
      this block, into any new page. No og:title/og:description: scrapers fall
      back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      property="og:image:alt"
      content="A dark blue and violet night sky. The Southern Cross glows near the centre, its stars joined by faint lines, with brighter magenta and yellow stars scattered around it."
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>drift</h1>
    </header>
    <main>
      <canvas
        id="sky"
        tabindex="0"
        aria-label="A night sky you can play, opening on the Southern Cross. Tap or drag anywhere to release a star that sounds a note; flick to send it drifting, and press the number keys 1 to 9 to place one without a pointer. Stars that pass close together harmonise, and ring when they touch."
      ></canvas>
      <p class="invite" id="invite">
        <span class="invite-line">touch the sky</span>
        <span class="invite-sub">drag to send a star drifting · or press 1–9</span>
      </p>
      <h2 class="sr-only">The stars this sky opens on</h2>
      <ul class="sr-only" id="catalogue"></ul>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
